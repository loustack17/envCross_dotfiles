name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed git python jq stow
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash -n install.sh scripts/*.sh scripts/secrets/*.sh scripts/mcp/*.sh
      - name: Manifest packages exist in Arch repos or AUR
        run: bash scripts/check-arch-packages.sh
      - name: Installer dry run
        run: bash install.sh --dry-run --no-backup
      - run: python -m unittest discover -s tests -v
