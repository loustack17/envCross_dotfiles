name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed git python jq stow
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash -n install.sh scripts/*.sh scripts/secrets/*.sh scripts/mcp/*.sh
      - name: Manifest packages exist in Arch repos or AUR
        run: bash scripts/check-arch-packages.sh
      - name: Installer dry run
        run: bash install.sh --dry-run --no-backup
      - run: python -m unittest discover -s tests -v
