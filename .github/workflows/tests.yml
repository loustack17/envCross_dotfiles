name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: bash -n install.sh scripts/install-moli.sh scripts/install-udev-rules.sh
      - run: python -m unittest discover -s tests -v
